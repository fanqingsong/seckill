apiVersion: v1
kind: Service
metadata:
  name: persist-service
  namespace: seckill
spec:
  selector:
    app: persist-service
  ports:
    - name: http
      port: 8086
      targetPort: 8086
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: persist-service
  namespace: seckill
spec:
  replicas: 1
  selector:
    matchLabels:
      app: persist-service
  template:
    metadata:
      labels:
        app: persist-service
      annotations:
        traffic.sidecar.istio.io/excludeOutboundPorts: "5432,6379,9092,9200"
    spec:
      containers:
        - name: persist
          image: seckill-persist-service:0.2.0-SNAPSHOT
          imagePullPolicy: IfNotPresent
          env:
            - name: JAVA_OPTS
              value: >-
                -Dspring.profiles.active=prd
                -Dspring.datasource.url=jdbc:postgresql://postgres:5432/seckill
                -Dseckill.redis.host=redis
          ports:
            - containerPort: 8086
          readinessProbe:
            httpGet:
              path: /health
              port: 8086
            initialDelaySeconds: 25
            periodSeconds: 5
