apiVersion: v1
kind: Service
metadata:
  name: query-service
  namespace: seckill
spec:
  selector:
    app: query-service
  ports:
    - name: http
      port: 8083
      targetPort: 8083
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: query-service
  namespace: seckill
spec:
  replicas: 1
  selector:
    matchLabels:
      app: query-service
  template:
    metadata:
      labels:
        app: query-service
      annotations:
        traffic.sidecar.istio.io/excludeOutboundPorts: "5432,6379,9092,9200"
    spec:
      containers:
        - name: query
          image: seckill-query-service:0.2.0-SNAPSHOT
          imagePullPolicy: IfNotPresent
          env:
            - name: JAVA_OPTS
              value: >-
                -Dspring.profiles.active=prd
                -Dseckill.redis.host=redis
                -Dseckill.es.url=http://elasticsearch:9200
          ports:
            - containerPort: 8083
          readinessProbe:
            httpGet:
              path: /health
              port: 8083
            initialDelaySeconds: 20
            periodSeconds: 5
