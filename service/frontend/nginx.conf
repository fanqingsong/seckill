server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker 内置 DNS。用变量 proxy_pass 才会在运行时重新解析，
    # 避免后端容器重建换 IP 后 nginx 仍连旧地址导致 502。
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /admin/ {
        set $admin_upstream admin-service:8081;
        proxy_pass http://$admin_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /command/ {
        set $command_upstream command-service:8082;
        proxy_pass http://$command_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /query/ {
        set $query_upstream query-service:8083;
        proxy_pass http://$query_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
