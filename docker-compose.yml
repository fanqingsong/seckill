services:
  mysql-write-db:
    image: "swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/mysql:5.7"
    hostname: write_db_server
    environment:
      - MYSQL_ROOT_PASSWORD=password
      - MYSQL_DATABASE=seckill
      - MYSQL_USER=seckill
      - MYSQL_PASSWORD=password
    ports:
      - "3306"
    command: ["--character-set-server=utf8", "--collation-server=utf8_general_ci"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-ppassword"]
      interval: 5s
      timeout: 5s
      retries: 30

  mysql-read-db:
    image: "swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/mysql:5.7"
    hostname: read_db_server
    environment:
      - MYSQL_ROOT_PASSWORD=password
      - MYSQL_DATABASE=seckill
      - MYSQL_USER=seckill
      - MYSQL_PASSWORD=password
    ports:
      - "3306"
    command: ["--character-set-server=utf8", "--collation-server=utf8_general_ci"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-ppassword"]
      interval: 5s
      timeout: 5s
      retries: 30

  activemq:
    image: "swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/webcenter/activemq:latest"
    hostname: queue-server
    environment:
      - ACTIVEMQ_ADMIN_LOGIN=admin
      - ACTIVEMQ_ADMIN_PASSWORD=admin
    ports:
      - "61616"

  admin-service:
    image: "seckill-admin-service:0.2.0-SNAPSHOT"
    pull_policy: never
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: admin-service
    hostname: admin-service
    depends_on:
      mysql-write-db:
        condition: service_healthy
    links:
      - "mysql-write-db:write_db.servicecomb.io"
    environment:
      - JAVA_OPTS=-Dspring.profiles.active=prd -Dspring.main.web-environment=true -Dendpoints.shutdown.enabled=true
    ports:
      - "8081:8081"
    restart: unless-stopped

  command-service:
    image: "seckill-command-service:0.2.0-SNAPSHOT"
    pull_policy: never
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: command-service
    hostname: command-service
    depends_on:
      mysql-write-db:
        condition: service_healthy
      activemq:
        condition: service_started
    links:
      - "mysql-write-db:write_db.servicecomb.io"
      - "activemq:queue.servicecomb.io"
    environment:
      - JAVA_OPTS=-Dspring.profiles.active=prd -Dspring.main.web-environment=true -Dendpoints.shutdown.enabled=true
    ports:
      - "8082:8082"
    restart: unless-stopped

  query-service:
    image: "seckill-query-service:0.2.0-SNAPSHOT"
    pull_policy: never
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: query-service
    hostname: query-service
    depends_on:
      mysql-read-db:
        condition: service_healthy
    links:
      - "mysql-read-db:read_db.servicecomb.io"
    environment:
      - JAVA_OPTS=-Dspring.profiles.active=prd -Dspring.main.web-environment=true -Dendpoints.shutdown.enabled=true
    ports:
      - "8083:8083"
    restart: unless-stopped

  event-service:
    image: "seckill-event-service:0.2.0-SNAPSHOT"
    pull_policy: never
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: event-service
    hostname: event-service
    depends_on:
      mysql-read-db:
        condition: service_healthy
      activemq:
        condition: service_started
    links:
      - "mysql-read-db:read_db.servicecomb.io"
      - "activemq:queue.servicecomb.io"
    environment:
      - JAVA_OPTS=-Dspring.profiles.active=prd -Dendpoints.shutdown.enabled=true
    restart: unless-stopped
