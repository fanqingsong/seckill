services:
  postgres:
    image: "swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/postgres:15-alpine"
    hostname: postgres
    environment:
      - POSTGRES_DB=seckill
      - POSTGRES_USER=seckill
      - POSTGRES_PASSWORD=password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seckill -d seckill"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: "swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/redis:7-alpine"
    hostname: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: "swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/apache/kafka:3.8.1"
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  elasticsearch:
    image: "swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/elasticsearch:7.17.9"
    hostname: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
    ports:
      - "9200:9200"

  admin-service:
    image: "seckill-admin-service:0.2.0-SNAPSHOT"
    pull_policy: never
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: admin-service
    hostname: admin-service
    depends_on:
      postgres:
        condition: service_healthy
    links:
      - "postgres:postgres.servicecomb.io"
    environment:
      - JAVA_OPTS=-Dspring.profiles.active=prd
    ports:
      - "8081:8081"
    restart: unless-stopped

  command-service:
    image: "seckill-command-service:0.2.0-SNAPSHOT"
    pull_policy: never
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: command-service
    hostname: command-service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    links:
      - "postgres:postgres.servicecomb.io"
      - "redis:redis.servicecomb.io"
      - "kafka:kafka.servicecomb.io"
    environment:
      - JAVA_OPTS=-Dspring.profiles.active=prd
    ports:
      - "8082:8082"
    restart: unless-stopped

  query-service:
    image: "seckill-query-service:0.2.0-SNAPSHOT"
    pull_policy: never
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: query-service
    hostname: query-service
    depends_on:
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_started
    links:
      - "redis:redis.servicecomb.io"
      - "elasticsearch:es.servicecomb.io"
    environment:
      - JAVA_OPTS=-Dspring.profiles.active=prd
    ports:
      - "8083:8083"
    restart: unless-stopped

  event-service:
    image: "seckill-event-service:0.2.0-SNAPSHOT"
    pull_policy: never
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: event-service
    hostname: event-service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      elasticsearch:
        condition: service_started
    links:
      - "postgres:postgres.servicecomb.io"
      - "redis:redis.servicecomb.io"
      - "kafka:kafka.servicecomb.io"
      - "elasticsearch:es.servicecomb.io"
    environment:
      - JAVA_OPTS=-Dspring.profiles.active=prd
    ports:
      - "8084:8084"
    restart: unless-stopped

  frontend:
    image: seckill-frontend:0.2.0-SNAPSHOT
    pull_policy: never
    build:
      context: ./service/frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - admin-service
      - command-service
      - query-service
    restart: unless-stopped
