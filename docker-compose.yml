services:
  postgres:
    image: "swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/postgres:15-alpine"
    hostname: postgres
    environment:
      - POSTGRES_DB=seckill
      - POSTGRES_USER=seckill
      - POSTGRES_PASSWORD=password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seckill -d seckill"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: "swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/redis:7-alpine"
    hostname: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  zookeeper:
    image: "swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/zookeeper:3.8"
    hostname: zookeeper
    environment:
      - ZOO_MY_ID=1
      - ZOO_SERVERS=server.1=zookeeper:2888:3888;2181

  kafka:
    image: "swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/wurstmeister/kafka:2.13-2.8.1"
    hostname: kafka
    depends_on:
      - zookeeper
    environment:
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_ADVERTISED_HOST_NAME=kafka
      - KAFKA_CREATE_TOPICS=seckill.events:3:1,seckill.events.dlt:1:1
    ports:
      - "9092:9092"
    links:
      - "zookeeper:zookeeper"

  elasticsearch:
    image: "swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/elasticsearch:7.17.9"
    hostname: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
    ports:
      - "9200:9200"

  admin-service:
    image: "seckill-admin-service:0.2.0-SNAPSHOT"
    pull_policy: never
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: admin-service
    hostname: admin-service
    depends_on:
      postgres:
        condition: service_healthy
    links:
      - "postgres:postgres.servicecomb.io"
    environment:
      - JAVA_OPTS=-Dspring.profiles.active=prd -Dspring.main.web-environment=true -Dendpoints.shutdown.enabled=true
    ports:
      - "8081:8081"
    restart: unless-stopped

  command-service:
    image: "seckill-command-service:0.2.0-SNAPSHOT"
    pull_policy: never
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: command-service
    hostname: command-service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    links:
      - "postgres:postgres.servicecomb.io"
      - "redis:redis.servicecomb.io"
      - "kafka:kafka.servicecomb.io"
    environment:
      - JAVA_OPTS=-Dspring.profiles.active=prd -Dspring.main.web-environment=true -Dendpoints.shutdown.enabled=true
    ports:
      - "8082:8082"
    restart: unless-stopped

  query-service:
    image: "seckill-query-service:0.2.0-SNAPSHOT"
    pull_policy: never
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: query-service
    hostname: query-service
    depends_on:
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_started
    links:
      - "redis:redis.servicecomb.io"
      - "elasticsearch:es.servicecomb.io"
    environment:
      - JAVA_OPTS=-Dspring.profiles.active=prd -Dspring.main.web-environment=true -Dendpoints.shutdown.enabled=true
    ports:
      - "8083:8083"
    restart: unless-stopped

  event-service:
    image: "seckill-event-service:0.2.0-SNAPSHOT"
    pull_policy: never
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: event-service
    hostname: event-service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
      elasticsearch:
        condition: service_started
    links:
      - "postgres:postgres.servicecomb.io"
      - "redis:redis.servicecomb.io"
      - "kafka:kafka.servicecomb.io"
      - "elasticsearch:es.servicecomb.io"
    environment:
      - JAVA_OPTS=-Dspring.profiles.active=prd -Dspring.main.web-environment=true -Dendpoints.shutdown.enabled=true
    ports:
      - "8084:8084"
    restart: unless-stopped

  frontend:
    image: seckill-frontend:0.2.0-SNAPSHOT
    pull_policy: never
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - admin-service
      - command-service
      - query-service
    restart: unless-stopped
